syntax = "proto3";

package imu.proto;

// Raw accelerometer data from driver (uncalibrated, SI units)
message RawAccelMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float x = 2;              // Uncalibrated X-axis (g)
    float y = 3;              // Uncalibrated Y-axis (g)
    float z = 4;              // Uncalibrated Z-axis (g)
}

// Raw gyroscope data from driver (uncalibrated, SI units)
message RawGyroMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float x = 2;              // Uncalibrated X-axis (rad/s)
    float y = 3;              // Uncalibrated Y-axis (rad/s)
    float z = 4;              // Uncalibrated Z-axis (rad/s)
}

// Raw magnetometer data from driver (uncalibrated, SI units)
message RawMagMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float x = 2;              // Uncalibrated X-axis (gauss)
    float y = 3;              // Uncalibrated Y-axis (gauss)
    float z = 4;              // Uncalibrated Z-axis (gauss)
}

// Raw temperature data from driver
message RawTempMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float temp_c = 2;         // Temperature (Celsius)
}

// Processed accelerometer data (calibrated, SI units)
message ProcAccelMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float x = 2;              // Calibrated X-axis (g)
    float y = 3;              // Calibrated Y-axis (g)
    float z = 4;              // Calibrated Z-axis (g)
}

// Processed gyroscope data (calibrated, SI units)
message ProcGyroMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float x = 2;              // Calibrated X-axis (rad/s)
    float y = 3;              // Calibrated Y-axis (rad/s)
    float z = 4;              // Calibrated Z-axis (rad/s)
}

// Processed magnetometer data (calibrated, SI units)
message ProcMagMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float x = 2;              // Calibrated X-axis (gauss)
    float y = 3;              // Calibrated Y-axis (gauss)
    float z = 4;              // Calibrated Z-axis (gauss)
}

// Processed temperature data
message ProcTempMsg {
    uint64 timestamp_ns = 1;  // Timestamp in nanoseconds
    float temp_c = 2;         // Temperature (Celsius)
}
